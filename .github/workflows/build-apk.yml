name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  # Fast, cheap gate. Runs before any Gradle work so a type error costs seconds
  # instead of the 6+ minutes an Android build takes.
  quality:
    name: Type check, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build web bundle
        run: pnpm build

  apk:
    name: Android APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Show toolchain
        run: java -version && echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Ensure SDK platform and build tools
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK" \
            "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK" --list_installed | grep -E "platforms|build-tools"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-debug.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "=== last 120 lines of Gradle output ==="
            tail -120 /tmp/gradle-debug.log
            exit "$status"
          fi

      - name: Build release APK (unsigned, on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-release.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "=== last 120 lines of Gradle output ==="
            tail -120 /tmp/gradle-release.log
            exit "$status"
          fi

      # Uploaded even on failure: the previous repository configured 7-day
      # artifact retention, so by the time anyone looked the logs were gone.
      - name: Upload Gradle logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ github.run_number }}
          path: /tmp/gradle-*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 7xcircle-authenticator-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            ## 7X Circle Authenticator ${{ github.ref_name }}

            - `*-debug.apk` — installable for testing, debug-signed.
            - `*-release.apk` — **unsigned**: no release keystore is configured
              in this repository yet, so this file cannot be installed directly.
              See CONTRIBUTING.md for the signing setup.

            所有数据仅保存在本机，应用不请求网络权限。
